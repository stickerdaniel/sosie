name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: forbid(unsafe_code) in every crate
        run: tools/check-forbid-unsafe.sh
      - name: Golden stamps
        run: node tools/golden-stamp.mjs --check

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
    name: test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch pinned pixel bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch-goldens.sh
      - name: Tests, golden parity and determinism
        run: cargo test --workspace --release -- --nocapture
      - name: Text bench
        run: cargo run --release --example bench_text
