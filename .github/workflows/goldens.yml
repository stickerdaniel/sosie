name: goldens

on:
  pull_request:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned pixel bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/fetch-goldens.sh
      - name: Count reference PNGs
        run: find target/goldens -name '*.png' | wc -l
