[package]
name = "sosie-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Browserless renderer core: fonts, text layout, display list and raster."

[dependencies]
harfrust = "0.15"
skrifa = "0.49"
icu_segmenter = "2.4"
icu_properties = "2"
unicode-bidi = "0.3"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
png = "0.18"
sha2 = "0.10"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
sha2 = "0.10"
cpu-time = "1.0.0"
